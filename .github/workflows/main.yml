name: Build AETHERFLUX Combo Aura

on:
  workflow_dispatch:   # tylko reczne uruchomienie (Actions -> Run workflow)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Dobierz rzeczywiste wersje Fabric (Loom, Yarn, Loader, Fabric API) dla Minecrafta z gradle.properties
        run: python3 scripts/resolve_versions.py

      - name: Wygeneruj Gradle Wrapper
        run: gradle wrapper

      - name: Clean build
        run: ./gradlew clean build --stacktrace 2>&1 | tee build.log
        shell: bash

      - name: Przygotuj JAR
        run: |
          mkdir -p dist
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | grep -v -- '-dev' | head -n1)
          echo "Znaleziono: $JAR"
          cp "$JAR" dist/AETHERFLUX-Combo-Aura.jar
          unzip -p dist/AETHERFLUX-Combo-Aura.jar fabric.mod.json

      - name: Publikuj JAR (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AETHERFLUX-Combo-Aura
          path: dist/AETHERFLUX-Combo-Aura.jar
          if-no-files-found: error

      - name: Publikuj kod zrodlowy z wersjami (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AETHERFLUX-Combo-Aura-sources
          path: build/libs/*-sources.jar
          if-no-files-found: ignore

      - name: Log bledow (tylko przy niepowodzeniu)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            gradle.properties
            build/reports/**
          if-no-files-found: ignore
